name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }} (${{ matrix.status }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            package: linux-x64-gnu
            status: rust-tested+binary-loaded
            command: npm exec -- napi build --release --target x86_64-unknown-linux-gnu --config-path napi.config.json --manifest-path native/signal/Cargo.toml --output-dir native/signal --js index.cjs -- --locked
          - target: x86_64-unknown-linux-musl
            package: linux-x64-musl
            status: rust-tested
            command: npm exec -- napi build --release --target x86_64-unknown-linux-musl --cross-compile --config-path napi.config.json --manifest-path native/signal/Cargo.toml --output-dir native/signal --js index.cjs -- --locked
          - target: aarch64-unknown-linux-gnu
            package: linux-arm64-gnu
            status: rust-tested
            command: npm exec -- napi build --release --target aarch64-unknown-linux-gnu --use-napi-cross --config-path napi.config.json --manifest-path native/signal/Cargo.toml --output-dir native/signal --js index.cjs -- --locked
          - target: aarch64-unknown-linux-musl
            package: linux-arm64-musl
            status: rust-tested
            command: npm exec -- napi build --release --target aarch64-unknown-linux-musl --cross-compile --config-path napi.config.json --manifest-path native/signal/Cargo.toml --output-dir native/signal --js index.cjs -- --locked
          - target: aarch64-linux-android
            package: android-arm64
            status: rust-tested
            command: npm exec -- napi build --release --target aarch64-linux-android --config-path napi.config.json --manifest-path native/signal/Cargo.toml --output-dir native/signal --js index.cjs -- --locked
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: zig
      - run: npm ci
      - name: Run the Rust test suite
        run: cargo test --locked --manifest-path native/signal/Cargo.toml
      - name: Build platform package
        run: ${{ matrix.command }}
      - name: Create npm artifact
        run: npm exec -- napi artifacts --config-path napi.config.json --output-dir native/signal --npm-dir npm
      - name: Load the Linux x64 GNU build and run the JS suite
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          npm test
      - name: Run the documentation gate
        # The documentation is executable: scripts/docs-verify.mjs runs every
        # fenced code block in README.md, CHANGELOG.md and docs/, plus every
        # examples/*.mjs, and fails the run on a non-zero exit. Nothing in
        # `npm test` touches the documentation that describes the
        # implementation, so a signature or an example in prose can go stale
        # indefinitely without this.
        #
        # Same leg as the JS suite, and for the same reason: every block
        # imports the package, so the native binding has to load first. The
        # `--js index.cjs` in the matrix command above does not regenerate the
        # committed loader — @napi-rs/cli's writeJsBinding returns early
        # without `--platform` — so both steps exercise the hand-patched loader
        # that actually ships.
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: npm run docs:verify
      - name: Runtime status
        run: |
          echo "${{ matrix.target }}: ${{ matrix.status }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signal-${{ matrix.package }}
          path: npm/${{ matrix.package }}
          if-no-files-found: error
