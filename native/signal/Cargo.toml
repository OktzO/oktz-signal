[package]
name = "signal-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.2", features = ["full"] }
napi-derive = "3.6.3"
# Curve (sama dgn oktz-curve25519)
curve25519-dalek = "4"
ed25519-dalek = "2"
sha2 = "0.10"
# AES-CBC + HMAC + HKDF
aes = "0.8"
block-modes = "0.9"
hmac = "0.12"
hkdf = "0.12"
base64 = "0.22"
# Session serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Random
rand = "0.8"

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
strip = "symbols"
